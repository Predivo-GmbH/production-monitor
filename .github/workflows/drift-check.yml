name: Staging-Prod Drift Check

# Nightly detection of schema / constraint / cron drift between each product's
# staging and production Supabase projects, plus unsubstituted <<placeholders>>
# in live cron rows. Migrations are applied per-environment by hand, so drift
# is otherwise invisible until it breaks something (investigation report §8:
# staging at 1 of prod's 9 crons; CHECK constraint missing a job type killed
# Auto-Pilot enqueue silently). A red run here IS the alert.

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # send-alert.mjs needs nodemailer; the drift script itself is dep-free.
      - run: npm ci

      - name: Check staging-prod drift (schema, constraints, cron, placeholders)
        run: node scripts/check-drift.mjs
        env:
          SUPABASE_TOKEN_REPLYFLOW: ${{ secrets.REPLYFLOW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN_CHANNELMOVER: ${{ secrets.SUPABASE_TOKEN_CHANNELMOVER }}
          SUPABASE_TOKEN_MUELLER: ${{ secrets.SUPABASE_TOKEN_MUELLER }}

      # Deploy-PIPELINE conformance: every fleet deploy.yml must still match the hardened
      # standard (prod gates on the recorded staging result instead of re-running staging;
      # functions-deploy retried; CLI pinned). Catches a future edit regressing the pipeline
      # back to the fragile shape that caused the 2026-07-15 prod-promotion failures.
      # Skips cleanly until FLEET_READ_TOKEN (classic PAT, repo:read) is set.
      - name: Check deploy-pipeline drift (deploy.yml conformance)
        # if: always() - 2026-09-01 audit. Without it this step inherits the default if:success(),
        # so ANY schema drift found by the step above SKIPPED this one entirely and a deploy
        # pipeline could regress unseen behind an unrelated failure. Same defect the hourly
        # monitor documents at its own sensor steps, and the same shape as the outage that
        # started this audit, where one failure hid the tests that would have named the cause.
        if: always()
        run: node scripts/check-pipeline-drift.mjs
        env:
          # Reuse DASHBOARD_PAT — the existing fleet-wide token this repo already uses to
          # read every repo's contents (keepalive-workflow-presence) and dispatch deploys
          # (auto-heal). FLEET_READ_TOKEN was never created, so this check skipped silently
          # in CI (dormant safety net); DASHBOARD_PAT activates it. Falls back to
          # FLEET_READ_TOKEN if a dedicated least-privilege token is added later.
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN || secrets.DASHBOARD_PAT }}
          # DB-backed fleet (getFleet). Optional: absent -> getFleet falls back to the hardcoded list.
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      # DID THE FLEET'S OWN SCHEDULED WORKFLOWS RUN? (added 2026-09-02 by the monitoring audit.)
      # The hourly monitor asks this for THIS repo's crons. Nothing asked it for the other twelve,
      # and the same hole is there: pull-engine's weekly technical-floor gate guards its heartbeat
      # with `if [ -n "$HC_URL" ]` and the secret it reads does not exist in that repo, so its
      # dead-man switch has never pinged anything. Daily rather than hourly because it costs one
      # API call per scheduled workflow and the fleet's GitHub allowance is a shared 5,000/hour
      # pool that has been drained to zero twice. if: always() so a drift failure above cannot
      # skip it, which is the defect this same audit fixed one step up.
      - name: Every scheduled workflow in the FLEET must have actually run
        if: always()
        run: node scripts/check-workflow-cadence.mjs --fleet
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN || secrets.DASHBOARD_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      # Drift-specific sender: renders the real drift findings (drift-results.json /
      # pipeline-drift-results.json) instead of send-alert.mjs's Playwright "no report
      # produced" fallback, which fired because this job never runs Playwright.
      # `|| cancelled()`: this job declares a timeout-minutes, and a job killed by its own cap
      # concludes `cancelled`, in which `failure()` is false — the overrun would be the one
      # failure this alarm could not report. Proven on monitor.yml, run 33818609882 (2026-09-04).
      # Safe here: cancel-in-progress is false, so a cancellation is never a routine supersede.
      - name: Send alert on failure
        if: ${{ failure() || cancelled() }}
        run: node scripts/send-drift-alert.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
