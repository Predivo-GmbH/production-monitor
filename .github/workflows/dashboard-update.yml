name: Daily Dashboard Update

on:
  schedule:
    # Every day at 21:00 UTC (23:00 CET / 22:00 CEST)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update project dashboard data
        run: bash scripts/update-dashboard.sh
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Send alert on failure
        if: failure()
        run: node scripts/send-alert.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Collects per-workflow GitHub Actions status across all repos → automation-status.json
  # (consumed by the BackOffice "Wie wir arbeiten" handbook) and emails if any workflow
  # has been red for >48h. Separate job so it runs even if the dashboard update fails.
  automation-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect automation status
        id: collect
        run: node scripts/automation-status.mjs
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      # Factory Cockpit: upsert the `kb` machine_state row (factory_state tile) from the
      # last commit touching the KB data file. Best-effort: the script always exits 0.
      - name: Factory heartbeat (cockpit machine_state - kb)
        if: always() && steps.collect.outcome == 'success'
        run: node scripts/factory-heartbeat.mjs kb
        env:
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

      # Always runs after collection; the script emails only when escalations exist
      # (red >48h) and exits 0 otherwise, so this never fails the job.
      - name: Escalate workflows red for >48h
        if: always() && steps.collect.outcome == 'success'
        run: node scripts/send-automation-alert.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com

      # Emails when previously-escalated workflows are green again (diff computed by
      # automation-status.mjs against the previously published report). Sends only
      # when /tmp/automation-resolved.json is non-empty.
      - name: Notify resolved escalations
        if: always() && steps.collect.outcome == 'success'
        run: node scripts/send-automation-resolved.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
