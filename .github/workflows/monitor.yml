name: Production Monitor

# CADENCE, MEASURED 2026-08-29 — read this before "fixing" the cron minute again.
#
# The 2026-08-28 audit reported this check running roughly three-hourly and proposed moving it
# off "the congested slot it shares". Both halves were tested against run history and BOTH ARE
# FALSE. Keeping the finding here because the next session will otherwise re-derive the wrong
# fix from the same symptom.
#
#   1. NOTHING SHARES :37. No workflow in any fleet repo schedules minute 37. The slot was
#      already moved off :00 in an earlier pass; that part of the job was already done.
#
#   2. THE MINUTE IS NOT THE CAUSE. Three hourly workflows at three different minutes, in two
#      different repos, one public and one private, degraded IDENTICALLY over the same window
#      (2026-08-27 ~01:00 to 2026-08-28 ~21:30 UTC) and recovered together:
#
#        production-monitor        cron 37 * * * *   13 gaps, mean 210 min, max 268 min
#        mailer-config-check       cron 47 * * * *   13 gaps, mean 209 min, max 262 min
#        BackOffice sync-remediate cron 30 * * * *   13 gaps, mean 210 min, max 271 min
#
#      Same three, healthy before and after: mean 61 min / 58 min. A cause that hits three
#      different minutes equally is not about the minute. GitHub drops scheduled ticks under
#      platform backlog and no cron value avoids that.
#
#   3. OUR OWN 08:00 BURST IS ALSO NOT THE CAUSE. Nine fleet workflows share `0 8 * * *`, so
#      the 08:37 tick was the suspect. Measured delay past the nominal tick, healthy windows
#      only: 08:37 mean 13.2 min — one of the BEST hours. The worst are 18:00-21:00 UTC
#      (mean 24-34 min, max 54 min), which is GitHub's global evening peak, not ours.
#
# WHAT WAS DONE INSTEAD: the dead-man's switch was shortened from six hours to three (see the
# Heartbeat step at the bottom of this file), so the next slip is SEEN. Detection was the real
# gap — across the whole 44-hour degradation the old 6-hour tolerance never once tripped.
on:
  schedule:
    - cron: '37 * * * *'  # Hourly at :37. Do not move it without new measurements — see the block above.
  workflow_dispatch:         # Manual trigger
    inputs:
      force_resolved_email:
        description: 'Send a test "all clear" resolution email (verifies the notification path)'
        type: boolean
        default: false
  push:
    branches: [master]

concurrency:
  group: production-monitor
  # A push to master must never cancel the hourly product check. It did, three times in the
  # four days to 2026-08-29 — runs 32823814431, 32844151137 and 33004593691 were each killed
  # 1-2 minutes after starting by a push run that entered the same group. Each cancelled run
  # is an hour with no fleet check AND no heartbeat ping, because the Heartbeat step below is
  # `if: success()` and a cancelled job is not a success.
  #
  # Consequence-free so far only because the push run happened to repeat the work each time.
  # That is luck, not design: a push that lands while the scheduled run is mid-flight and then
  # fails leaves the hour uncovered and the heartbeat silent, which is the exact shape this
  # file exists to make impossible. The window is wide — a run takes up to 20 minutes, so
  # roughly one push in three lands inside it.
  #
  # `cancel-in-progress: false` IS THE FIX, and the obvious-looking alternative is not.
  # `${{ github.event_name != 'schedule' }}` was tried first and is WRONG, proven within two
  # minutes by run 33250652722: the flag is read from the run that ARRIVES, not the one already
  # running, so a push still cancelled the scheduled run — it only stopped a schedule cancelling
  # a push, which nobody wanted. Do not reintroduce it.
  #
  # false does not queue pushes up forever either: GitHub keeps at most one pending run per
  # group and a newer pending run cancels the older pending one, so a push storm still
  # collapses to its newest commit. It just waits for the hourly check instead of killing it.
  #
  # RESIDUAL RISK, ACCEPTED KNOWINGLY. That same "newest pending wins" rule can still drop a
  # scheduled tick: push run in progress, scheduled tick arrives and goes pending, second push
  # arrives and evicts the pending scheduled run. The obvious cure is a separate group per
  # event (`production-monitor-${{ github.event_name }}`), and it is REJECTED: it lets a
  # scheduled and a push run execute at the same time, and both begin by DELETING every message
  # in the shared OTP test mailbox before the e2e signup tests read their codes out of it. Two
  # concurrent runs would eat each other's verification mails and report live products as
  # broken. A rare dropped tick that the (now three-hour) heartbeat can see beats a
  # manufactured product alarm nobody can distinguish from a real one.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Clear shared OTP test inbox (keeps IMAP search fast -> prevents run timeouts)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import imaplib, ssl, os
          ctx = ssl._create_unverified_context()
          m = imaplib.IMAP4_SSL(os.environ['IMAP_HOST'], int(os.environ.get('IMAP_PORT') or 993), ssl_context=ctx)
          m.login(os.environ['IMAP_USER'], os.environ['IMAP_PASS'])
          m.select('INBOX')
          ids = m.search(None, 'ALL')[1][0].split()
          if ids:
              m.store(b','.join(ids), '+FLAGS', '\\Deleted'); m.expunge()
          print(f'cleared {len(ids)} messages from the shared OTP test inbox')
          m.logout()
          PY
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}

      - name: Run production monitor
        # Backstop for the config's globalTimeout, in case the Playwright runner itself wedges.
        # A STEP timeout fails the job (conclusion=failure -> alert fires); the job-level
        # timeout-minutes above yields conclusion=cancelled, which silences every alert path.
        timeout-minutes: 18
        run: npx playwright test --project=chromium
        env:
          # BackOffice
          BACKOFFICE_URL: https://backoffice.predivo.ch
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}
          BACKOFFICE_ANON_KEY: ${{ secrets.BACKOFFICE_ANON_KEY }}
          BACKOFFICE_SUPABASE_ACCESS_TOKEN: ${{ secrets.BACKOFFICE_SUPABASE_ACCESS_TOKEN }}
          # ScoutCopilot
          SCOUTCOPILOT_URL: https://scoutcopilot.com
          SCOUTCOPILOT_SUPABASE_URL: ${{ secrets.SCOUTCOPILOT_SUPABASE_URL }}
          SCOUTCOPILOT_SERVICE_ROLE_KEY: ${{ secrets.SCOUTCOPILOT_SERVICE_ROLE_KEY }}
          SCOUTCOPILOT_ANON_KEY: ${{ secrets.SCOUTCOPILOT_ANON_KEY }}
          # ChannelMover
          YTMIGRATION_URL: https://channelmover.com
          YTMIGRATION_SUPABASE_URL: ${{ secrets.YTMIGRATION_SUPABASE_URL }}
          YTMIGRATION_SERVICE_ROLE_KEY: ${{ secrets.YTMIGRATION_SERVICE_ROLE_KEY }}
          YTMIGRATION_ANON_KEY: ${{ secrets.YTMIGRATION_ANON_KEY }}
          YTMIGRATION_SUPABASE_ACCESS_TOKEN: ${{ secrets.YTMIGRATION_SUPABASE_ACCESS_TOKEN }}
          # ReplyFlow
          REPLYFLOW_URL: https://replyflow.help
          REPLYFLOW_SUPABASE_URL: ${{ secrets.REPLYFLOW_SUPABASE_URL }}
          REPLYFLOW_SERVICE_ROLE_KEY: ${{ secrets.REPLYFLOW_SERVICE_ROLE_KEY }}
          REPLYFLOW_ANON_KEY: ${{ secrets.REPLYFLOW_ANON_KEY }}
          REPLYFLOW_SUPABASE_ACCESS_TOKEN: ${{ secrets.REPLYFLOW_SUPABASE_ACCESS_TOKEN }}
          # Distribution-OS
          DISTRIBUTIONOS_URL: https://distributionos.predivo.ch
          DISTRIBUTIONOS_SUPABASE_URL: ${{ secrets.DISTRIBUTIONOS_SUPABASE_URL }}
          DISTRIBUTIONOS_SERVICE_ROLE_KEY: ${{ secrets.DISTRIBUTIONOS_SERVICE_ROLE_KEY }}
          DISTRIBUTIONOS_ANON_KEY: ${{ secrets.DISTRIBUTIONOS_ANON_KEY }}
          # Arivioo
          ARIVIOO_URL: https://arivioo.com
          ARIVIOO_SUPABASE_URL: ${{ secrets.ARIVIOO_SUPABASE_URL }}
          ARIVIOO_SERVICE_ROLE_KEY: ${{ secrets.ARIVIOO_SERVICE_ROLE_KEY }}
          ARIVIOO_ANON_KEY: ${{ secrets.ARIVIOO_ANON_KEY }}
          # LaunchReady
          LAUNCHREADY_URL: https://launchready.predivo.ch
          LAUNCHREADY_SUPABASE_URL: ${{ secrets.LAUNCHREADY_SUPABASE_URL }}
          LAUNCHREADY_SERVICE_ROLE_KEY: ${{ secrets.LAUNCHREADY_SERVICE_ROLE_KEY }}
          LAUNCHREADY_ANON_KEY: ${{ secrets.LAUNCHREADY_ANON_KEY }}
          # SignalScore
          SIGNALSCORE_URL: https://signalscore.ch
          SIGNALSCORE_SUPABASE_URL: ${{ secrets.SIGNALSCORE_SUPABASE_URL }}
          SIGNALSCORE_SERVICE_ROLE_KEY: ${{ secrets.SIGNALSCORE_SERVICE_ROLE_KEY }}
          SIGNALSCORE_ANON_KEY: ${{ secrets.SIGNALSCORE_ANON_KEY }}
          SIGNALSCORE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SIGNALSCORE_SUPABASE_ACCESS_TOKEN }}
          # Predivo
          PREDIVO_URL: https://predivo.ch
          # Valrano
          VALRANO_URL: https://valrano.com
          VALRANO_SUPABASE_URL: ${{ secrets.VALRANO_SUPABASE_URL }}
          VALRANO_SERVICE_ROLE_KEY: ${{ secrets.VALRANO_SERVICE_ROLE_KEY }}
          VALRANO_ANON_KEY: ${{ secrets.VALRANO_ANON_KEY }}
          VALRANO_SUPABASE_ACCESS_TOKEN: ${{ secrets.VALRANO_SUPABASE_ACCESS_TOKEN }}
          # Keep-alive only (no production site)
          JASSTOUR_SUPABASE_URL: ${{ secrets.JASSTOUR_SUPABASE_URL }}
          JASSTOUR_ANON_KEY: ${{ secrets.JASSTOUR_ANON_KEY }}
          # Staging projects (keep-alive)
          BACKOFFICE_STAGING_SUPABASE_URL: ${{ secrets.BACKOFFICE_STAGING_SUPABASE_URL }}
          BACKOFFICE_STAGING_ANON_KEY: ${{ secrets.BACKOFFICE_STAGING_ANON_KEY }}
          REPLYFLOW_STAGING_SUPABASE_URL: ${{ secrets.REPLYFLOW_STAGING_SUPABASE_URL }}
          REPLYFLOW_STAGING_ANON_KEY: ${{ secrets.REPLYFLOW_STAGING_ANON_KEY }}
          SIGNALSCORE_STAGING_SUPABASE_URL: ${{ secrets.SIGNALSCORE_STAGING_SUPABASE_URL }}
          SIGNALSCORE_STAGING_ANON_KEY: ${{ secrets.SIGNALSCORE_STAGING_ANON_KEY }}
          VALRANO_STAGING_SUPABASE_URL: ${{ secrets.VALRANO_STAGING_SUPABASE_URL }}
          VALRANO_STAGING_ANON_KEY: ${{ secrets.VALRANO_STAGING_ANON_KEY }}
          BOATBUDDY_SUPABASE_URL: ${{ secrets.BOATBUDDY_SUPABASE_URL }}
          BOATBUDDY_ANON_KEY: ${{ secrets.BOATBUDDY_ANON_KEY }}
          BOATBUDDY_STAGING_SUPABASE_URL: ${{ secrets.BOATBUDDY_STAGING_SUPABASE_URL }}
          BOATBUDDY_STAGING_ANON_KEY: ${{ secrets.BOATBUDDY_STAGING_ANON_KEY }}
          # Workflow presence check
          DASHBOARD_PAT: ${{ secrets.DASHBOARD_PAT }}
          # IMAP (for E2E OTP email reading)
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          OTP_TEST_EMAIL: ${{ secrets.IMAP_USER }}
          # Alert config
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          # Test user
          TEST_EMAIL: healthcheck-test@predivo.ch

      # Supabase machine health + build currency. Added 2026-08-29 after Supabase, not us,
      # was the first to notice that ScoutCopilot's machine was burning 7.74 MB/s of disk
      # while idle. Cause was the platform build it sat on (17.6.1.084): 74.1 KB read per
      # page fault before the free upgrade to 17.6.1.166, 32.3 KB after, total disk traffic
      # down to 0.67/7.74 = 8.7%. Neither the load nor the stale build was measured by
      # anything we owned. Both are now. Runs even if the suite above failed, because a
      # machine burning disk is exactly the state that also breaks other checks.
      - name: Supabase machine health (disk load per project)
        if: always()
        run: node scripts/check-supabase-machine-health.mjs
        env:
          SCOUTCOPILOT_SUPABASE_URL: ${{ secrets.SCOUTCOPILOT_SUPABASE_URL }}
          SCOUTCOPILOT_SERVICE_ROLE_KEY: ${{ secrets.SCOUTCOPILOT_SERVICE_ROLE_KEY }}
          REPLYFLOW_SUPABASE_URL: ${{ secrets.REPLYFLOW_SUPABASE_URL }}
          REPLYFLOW_SERVICE_ROLE_KEY: ${{ secrets.REPLYFLOW_SERVICE_ROLE_KEY }}
          SIGNALSCORE_SUPABASE_URL: ${{ secrets.SIGNALSCORE_SUPABASE_URL }}
          SIGNALSCORE_SERVICE_ROLE_KEY: ${{ secrets.SIGNALSCORE_SERVICE_ROLE_KEY }}
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}
          DISTRIBUTIONOS_SUPABASE_URL: ${{ secrets.DISTRIBUTIONOS_SUPABASE_URL }}
          DISTRIBUTIONOS_SERVICE_ROLE_KEY: ${{ secrets.DISTRIBUTIONOS_SERVICE_ROLE_KEY }}
          LAUNCHREADY_SUPABASE_URL: ${{ secrets.LAUNCHREADY_SUPABASE_URL }}
          LAUNCHREADY_SERVICE_ROLE_KEY: ${{ secrets.LAUNCHREADY_SERVICE_ROLE_KEY }}
          VALRANO_SUPABASE_URL: ${{ secrets.VALRANO_SUPABASE_URL }}
          VALRANO_SERVICE_ROLE_KEY: ${{ secrets.VALRANO_SERVICE_ROLE_KEY }}
          BOATBUDDY_SUPABASE_URL: ${{ secrets.BOATBUDDY_SUPABASE_URL }}
          BOATBUDDY_SERVICE_ROLE_KEY: ${{ secrets.BOATBUDDY_SERVICE_ROLE_KEY }}

      - name: Supabase build currency (how far behind each project is)
        if: always()
        run: node scripts/check-supabase-build-currency.mjs
        env:
          SUPABASE_TOKEN_SCOUTCOPILOT: ${{ secrets.SUPABASE_TOKEN_SCOUTCOPILOT }}
          SUPABASE_TOKEN_MUELLER: ${{ secrets.SUPABASE_TOKEN_MUELLER }}
          SIGNALSCORE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SIGNALSCORE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Out-of-band canaries: dead/rotated secrets and vendor retirements never
      # enter git, so only a live-credential probe can catch them (the class
      # behind ChannelMover's 5-day outage — investigation report §8). A canary
      # failure fails the run and rides the same alert email + healthchecks chain.
      - name: Out-of-band canaries (live credentials, vendor liveness)
        if: always()  # independent probe — must run even if the monitor step above failed (a dead secret often fails both)
        run: node scripts/run-canaries.mjs
        env:
          REPLYFLOW_SUPABASE_URL: ${{ secrets.REPLYFLOW_SUPABASE_URL }}
          REPLYFLOW_SERVICE_ROLE_KEY: ${{ secrets.REPLYFLOW_SERVICE_ROLE_KEY }}
          YTMIGRATION_SUPABASE_URL: ${{ secrets.YTMIGRATION_SUPABASE_URL }}
          YTMIGRATION_SERVICE_ROLE_KEY: ${{ secrets.YTMIGRATION_SERVICE_ROLE_KEY }}
          SIGNALSCORE_SUPABASE_URL: ${{ secrets.SIGNALSCORE_SUPABASE_URL }}
          SIGNALSCORE_SERVICE_ROLE_KEY: ${{ secrets.SIGNALSCORE_SERVICE_ROLE_KEY }}
          VALRANO_SUPABASE_URL: ${{ secrets.VALRANO_SUPABASE_URL }}
          VALRANO_SERVICE_ROLE_KEY: ${{ secrets.VALRANO_SERVICE_ROLE_KEY }}
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}
          LAUNCHREADY_SUPABASE_URL: ${{ secrets.LAUNCHREADY_SUPABASE_URL }}
          LAUNCHREADY_SERVICE_ROLE_KEY: ${{ secrets.LAUNCHREADY_SERVICE_ROLE_KEY }}
          SCOUTCOPILOT_SUPABASE_URL: ${{ secrets.SCOUTCOPILOT_SUPABASE_URL }}
          SCOUTCOPILOT_SERVICE_ROLE_KEY: ${{ secrets.SCOUTCOPILOT_SERVICE_ROLE_KEY }}
          DISTRIBUTIONOS_SUPABASE_URL: ${{ secrets.DISTRIBUTIONOS_SUPABASE_URL }}
          DISTRIBUTIONOS_SERVICE_ROLE_KEY: ${{ secrets.DISTRIBUTIONOS_SERVICE_ROLE_KEY }}
          BOATBUDDY_SUPABASE_URL: ${{ secrets.BOATBUDDY_SUPABASE_URL }}
          BOATBUDDY_SERVICE_ROLE_KEY: ${{ secrets.BOATBUDDY_SERVICE_ROLE_KEY }}
          # PAID-KEY GATE: unset until Roger approves — canaries self-skip loudly.
          ANTHROPIC_API_KEY_CANARY: ${{ secrets.ANTHROPIC_API_KEY_CANARY }}
          STRIPE_SECRET_KEY_CANARY: ${{ secrets.STRIPE_SECRET_KEY_CANARY }}

      - name: Auto-fix known failure patterns
        if: failure()
        run: node scripts/auto-fix.mjs || true
        env:
          GIT_AUTHOR_NAME: Production Monitor
          GIT_AUTHOR_EMAIL: noreply@predivo.ch
          GIT_COMMITTER_NAME: Production Monitor
          GIT_COMMITTER_EMAIL: noreply@predivo.ch

      - name: Auto-heal — redeploy broken sites
        if: failure()
        run: node scripts/auto-heal.mjs || true
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}

      # Agent-triage (Phase 2, Tier B): for failures the fast patterns + auto-heal could NOT
      # resolve, a headless Claude agent diagnoses each and either self-heals a drifted monitor
      # spec (commit to THIS repo), opens a PR on the target repo for a real regression, or
      # escalates with a written root-cause. PAID-KEY GATE: dormant (self-skips, exit 0) until
      # Roger sets var AGENT_TRIAGE_ENABLED=1 + secret AGENT_TRIAGE_API_KEY — so the CLI install
      # is itself gated to avoid any cost while off.
      - name: Agent triage (Tier B — diagnose + remediate novel failures)
        if: failure()
        run: |
          if [ "${AGENT_TRIAGE_ENABLED}" = "1" ] && [ -n "${ANTHROPIC_API_KEY}" ]; then
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || echo "claude CLI install failed"
          fi
          node scripts/agent-triage.mjs || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_TRIAGE_API_KEY }}
          AGENT_TRIAGE_ENABLED: ${{ vars.AGENT_TRIAGE_ENABLED }}
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}

      # LAYER 2 of the CI runner alarm: who watches the watchdog.
      #
      # ci-runner-watchdog.yml (every 10 min) moves the fleet back to paid runners when the
      # office PC stops taking build jobs. That covers the PC dying. It does NOT cover ITSELF
      # dying - a scheduled workflow can go silent (disabled after 60 days of repo inactivity,
      # deleted, renamed, or the Actions spend cap tripping and stopping every workflow in the
      # account). Silence produces no red run and therefore no alert, which is exactly the
      # failure shape a heartbeat exists to catch.
      #
      # It lives HERE because this workflow is hourly and already carries the fleet's
      # healthchecks.io dead-man's switch, so the CI alarm inherits real heartbeat coverage
      # without needing a 21st healthchecks check - and the account is at 20 of 20 (verified
      # 2026-08-24: POST /api/v3/checks/ returns HTTP 403 at the plan ceiling).
      #
      # Threshold is loose on purpose (90 min for a 10-min job = 9 missed ticks allowed).
      # GitHub drops scheduled ticks routinely, including this very workflow's, and an alarm
      # that cries wolf gets ignored - which is worse than no alarm.
      - name: CI runner watchdog is still alive
        id: ci_watchdog_alive
        # continue-on-error so a silent-watchdog result does NOT put the job in failure(): its own
        # dedicated email below is the alert. Without this, the generic "Send alert on failure" step
        # would ALSO fire (send-alert.mjs surfaces "Run failed - no per-test detail" over an all-green
        # table), double-mailing one event with one message misdescribing itself. The step's `outcome`
        # is still 'failure', so the scoped email below still fires; the job's healthchecks heartbeat
        # (Layer 3) still pings, so a silent Layer-1 watchdog does not cascade into a false Layer-3 alarm.
        continue-on-error: true
        run: node scripts/check-ci-watchdog-alive.mjs
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}

      # LAYER 2 for the fleet's auto-fixer. The board drainer ran on schedule for 30 hours on
      # 2026-08-24 and fixed NOTHING - three permanently-stuck items ate the whole per-run
      # budget while 34 incidents waited behind them. Every alarm we had asked "did it run?",
      # and it did, so nothing ever went red; Roger found it by reading the board himself.
      #
      # This asks the two questions liveness cannot: did a run happen at all, and is work that
      # COULD be dispatched actually being dispatched. It runs HERE rather than on the drainer's
      # own machine on purpose - an alarm hosted by the thing it watches dies with it.
      #
      # It files the alarm as a SIGNAL (signal-intake), so the self-heal window, dedup and page
      # policy all apply. `board-drainer` has deliberately NOT been given a page policy: the
      # first signal it files will appear on /signals under "nobody ever decided whether these
      # may alert you", with the two buttons that settle it. A new pager that pages before
      # anyone chose it is the default-nobody-chose failure this whole system exists to remove.
      - name: The fleet auto-fixer is still fixing things
        if: always()  # independent sensor — must run even if the monitor step above failed. check-drainer-progress.mjs exits 0 on a filed alarm (only a failed read reds the job), so this cannot double-red one event.
        run: node scripts/check-drainer-progress.mjs
        env:
          BOARD_SUPABASE_SECRET: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      # A dead automation must ALERT, not merely be visible. healthchecks.io knows within
      # minutes that a scheduled job stopped checking in, but until 2026-08-25 that fact only
      # ever appeared on a screen: the jobs grid renders the check grey and nobody is told, so
      # a dead automation stayed dead until somebody happened to look. This files a DOWN check
      # as a signal, which puts it in the cockpit's "needs you" band and lets it page.
      #
      # BOTH accounts are read (the original is at its 20-check plan ceiling, so CI heartbeats
      # live in a second one). A monitor that read only one would report "nothing is down"
      # while the other burned, and an unreadable key fails the step rather than reporting zero.
      - name: A scheduled job that went dark must say so
        if: always()  # independent sensor — must run even if the monitor step above failed. check-healthchecks-down.mjs exits 0 on a filed alarm (only a failed read reds the job), so this cannot double-red one event.
        run: node scripts/check-healthchecks-down.mjs
        env:
          HEALTHCHECKS_API_KEYS: ${{ secrets.HEALTHCHECKS_API_KEYS }}
          BOARD_SUPABASE_SECRET: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      # Sentry must reach the BOARD, not an inbox. The step above gave scheduled jobs a direct
      # wire into /signals in August; Sentry never had one. Its only route to Roger ran through
      # Gmail and an hourly assistant reading it, which loses a signal three ways: a project with
      # no alert rule never mails, the inbox tidy-up can file the mail first (a decision once sat
      # unseen for seven days that way), and a different assistant naming it every hour makes the
      # entries inconsistent by construction. Production carried 25 `source=sentry` rows under SIX
      # different key conventions on 2026-08-27, so dedup could not work and did not.
      #
      # THE BAR IS ENVIRONMENT, and only environment: an unresolved issue is filed when it has
      # been seen somewhere live. Volume, recency, affected users and project were each measured
      # against the same 13 live issues first and each dropped genuine production errors; the
      # reasoning is in the script's header with the numbers. Staging errors are deliberately not
      # filed - staging exists to break, and an alarm from it teaches you to ignore alarms.
      #
      # It cannot ring anything. Every row is filed needs_human:false (an application error is
      # code, so a machine owns it) and `sentry` has no signal_page_policy row, so upsert_signal
      # records `policy-off` and no page is ever scheduled. A chronic error is a board item.
      #
      # A failed read fails the STEP rather than reporting an empty fleet: if Sentry cannot be
      # reached, "no errors" is a lie and the tile on /signals must say unknown.
      - name: An application error must land on the board, not in an inbox
        if: always()  # independent sensor — must run even if the monitor step above failed, which is exactly when application errors matter most. check-sentry-issues.mjs returns 0 on a filed alarm and only exits 1 when Sentry cannot be READ, so this cannot double-red one event. Same reasoning as 9868af6 applied to the three neighbouring sensors.
        run: node scripts/check-sentry-issues.mjs
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          BOARD_SUPABASE_SECRET: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      # The GitHub REST allowance is one shared 5,000/hour pool for the whole account, and until
      # 2026-08-27 nothing watched it — check-ci-budget watches the Actions BILL, not the request
      # quota. That afternoon the pool drained to 0 twice and started refusing our own deploys
      # (a Cockpit prod promotion could not be dispatched; `gh run watch` died with HTTP 403), and
      # the first anyone knew was the refused deploy. This reads .resources.core once an hour (the
      # /rate_limit endpoint is FREE — it does not consume the allowance) and files a signal when
      # the pool is spent or on track to be, so a runaway consumer surfaces within the hour.
      # Uses DASHBOARD_PAT on purpose: we must measure the USER pool (id 251853205) that runs dry,
      # not the per-repo github.token pool. Source `github-api-budget` has no page policy, so the
      # first signal lands on /signals for Roger to decide, and never rings his phone unasked.
      - name: The shared GitHub API allowance must not run dry unseen
        if: always()
        run: node scripts/check-github-api-budget.mjs
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
          BOARD_SUPABASE_SECRET: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      # Two guards, doing two different jobs, both required:
      #   1. This step is scoped to `ci_watchdog_alive.outcome == 'failure'` so it fires ONLY for a
      #      silent watchdog, never on some unrelated earlier monitor failure.
      #   2. The `continue-on-error` on ci_watchdog_alive (above) keeps that failure OUT of the job's
      #      failure() state, so the generic "Send alert on failure" step does NOT also mail for the
      #      same event. Scoping this step alone does not stop that - only continue-on-error does.
      # The findings file is written with watchdog_silent:true so send-ci-runner-alert.mjs uses its
      # distinct "watchdog silent - no automatic fallback" copy, not the benign "moved to paid runners"
      # template, and exits 0 (the email is the alert; the run stays green).
      # A LIVE PRODUCT BEING UNREACHABLE MUST REACH ROGER — and until now nothing ever filed
      # one. `production-monitor` has been armed in signal_page_policy since 2026-08-24 (may_page,
      # 900s self-heal window, note "Confirmed production down"), and the audit of 2026-08-27
      # found the alarm wired to a sensor that does not exist: "Money, a stuck customer and a
      # dying credential are armed to ring your phone and have never received a single report,
      # because nothing files one." Separately the count of unreachable products lost its only
      # tile in the /monitoring -> /signals merge, so for three days it was on no page either.
      #
      # ONLY PERSISTENT FAILURE ALARMS. A product that fails is re-probed three times inside the
      # run, and the first confirmed sighting is filed `warning` / needs_human:false, which
      # upsert_signal records as `not-eligible` and which rings NOTHING. Only the next hourly run
      # finding the same product still unreachable escalates it to critical and arms the phone.
      # A product down for fifty minutes is on the board and silent.
      #
      # It fails the step rather than reporting zero when `fleet_projects` comes back empty: a
      # registry read that returned nothing is not a fleet with nothing wrong.
      - name: A product a customer cannot use must say so
        if: always()  # THE FIX: a product being down is exactly what fails the monitor step above, and default if:success() then SKIPS this sensor — the alarm was armed to never fire. Matches the canary at :154. check-products-down.mjs exits 0 on a filed alarm (only a failed read reds the job), so this cannot double-red one event.
        run: node scripts/check-products-down.mjs
        env:
          BOARD_SUPABASE_SECRET: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      - name: Email when the CI runner watchdog has gone silent
        if: ${{ always() && steps.ci_watchdog_alive.outcome == 'failure' }}
        run: |
          node -e "require('fs').writeFileSync('ci-runner-findings.json', JSON.stringify({generated_at:new Date().toISOString(),watchdog_silent:true,flips:[],findings:['The CI runner watchdog has stopped running. While it is silent nobody is checking whether the office PC is taking build jobs, so if that machine goes down deploys would queue with no alert. Check the ci-runner-watchdog workflow in production-monitor.']},null,2))"
          node scripts/send-ci-runner-alert.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send alert on failure
        if: failure()
        run: node scripts/send-alert.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}   # edge-triggered dedup: query the previous run + download its results.json to suppress duplicate alerts for an already-known ongoing failure

      - name: Send resolution email if previous run failed
        if: success()
        run: node scripts/send-resolved.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          FORCE_RESOLVED_EMAIL: ${{ inputs.force_resolved_email }}

      # Dead-man's-switch: ping healthchecks.io on every successful run. If this monitor
      # ever stops firing (GitHub disables the cron on repo inactivity, runner never starts),
      # the ping stops arriving and healthchecks.io emails after the grace period. This is what
      # would have caught the 66-day-red ScoutCopilot CI: a monitor with no heartbeat fails
      # silent.
      #
      # TOLERANCE: period 3600s + grace 7200s = THREE HOURS of silence, set 2026-08-29.
      # It was six hours (grace 18000) and that is why it never once complained while the
      # check ran three-hourly for 44 hours. Chosen from the real ping-to-ping history of
      # check 3cdddf35 rather than from this cron line:
      #
      #   worst healthy gap                    79 min   (2026-08-29 01:05)
      #   worst healthy gap + ONE missed run  ~139 min  -> must NOT fire; fleet policy is that
      #                                                   a single failed run never alarms
      #   TWO missed runs                     ~199 min  -> must fire
      #   the 27-28 Aug degradation      159..268 min   -> old 360-min tolerance: never fired
      #                                                   new 180-min tolerance: fires
      #
      # 180 min sits between "one missed run" and "two missed runs" with 41 min of headroom
      # over the worst tolerable case. Note the ping is `if: success()`, so three consecutive
      # RED runs also trip it — that is wanted: a monitor red for three hours is its own
      # incident, and the 2026-08-26 run of twelve consecutive failures over eleven hours
      # produced no heartbeat complaint at all under the old setting.
      - name: Heartbeat (healthchecks.io dead-man's-switch)
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HC_PING_MONITOR_HOURLY }}" || true

      # Factory Cockpit: upsert the `monitoring` machine_state row (factory_state tile).
      # Best-effort: the script always exits 0; staleness/alert is the failure signal.
      - name: Factory heartbeat (cockpit machine_state)
        if: always()
        run: node scripts/factory-heartbeat.mjs monitoring
        env:
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
