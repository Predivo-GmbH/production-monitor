name: CI Cost Guard

# Fails when CI starts getting expensive again. This is the fourth attempt at bringing the
# GitHub Actions bill down; the first three were one-time edits with nothing watching them, and
# each was silently undone - keep-alive.yml deleted 2026-05-22 and re-added 2026-06-08, test.yml
# deleted 2026-05-22 and re-added 2026-07-09 by a commit titled "working-tree cleanup". Nothing
# ever failed, so nobody noticed. This is the thing that fails.
#
# Free to run: this repository is public.

on:
  schedule:
    - cron: '10 7 * * 1' # Mondays 07:10 UTC, after the other fleet guards
  workflow_dispatch:
    inputs:
      window_days:
        # A red run raises exactly one question the fixed 7-day window cannot answer: is this
        # money we are STILL spending, or the tail of something already fixed? On 2026-08-29 the
        # guard read $149.63/month, and most of it turned out to be pre-migration runs from
        # 08-23/24 decaying out of the window - the fleet had already moved onto the self-hosted
        # runners and the bill had stopped. Answering that took a hand-written crawl because the
        # window was only settable by editing this file. Now it is an input: re-run over 3 days
        # to see the CURRENT burn rate before cutting anything that is already fixed.
        description: 'Days to measure (default 7). Use a short window to see the current burn rate.'
        required: false
        default: '7'

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Compare every workflow against its declared cost ceiling
        run: node scripts/check-ci-budget.mjs
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
          # 2026-08-30: scheduled runs use a 3-day window until the pre-migration runner tail
          # (2026-08-23/24) decays out of the 7-day window. Revert to 7 after 2026-09-07.
          # Manual dispatch keeps default 7 so a short window is an explicit choice.
          CI_BUDGET_WINDOW_DAYS: ${{ inputs.window_days || 3 }}

      - name: Heartbeat
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS -m 10 --retry 3 "${{ secrets.HC_PING_CI_BUDGET }}" || true
          else
            curl -fsS -m 10 --retry 3 "${{ secrets.HC_PING_CI_BUDGET }}/fail" || true
          fi
