name: v11 Gate Coverage Guard

# Enforces that every REQUIRED app carries a GREEN v11 staging-gate harness. A red run here
# means an enrolled project's gates broke; the PENDING list it prints is the living backfill
# queue (any past app not yet enrolled, or a future app that skipped the project-starter
# template, shows here until enrolled). Read-only, cross-repo via FLEET_READ_TOKEN.

on:
  schedule:
    - cron: '40 6 * * 1' # Mondays 06:40 UTC (after the grant-drift + auth-email guards)
  workflow_dispatch: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # nodemailer lives in devDependencies; without this the alert path crashes with
      # "Cannot find package 'nodemailer'" (run 33506279928, 2026-09-01) — a real broken-gate
      # finding was detected and then could not be emailed. Same install step monitor.yml uses.
      - run: npm ci
      - name: Check v11 gate coverage across the fleet
        run: node scripts/check-gate-coverage.mjs
        env:
          # classic PAT with repo:read across the Arivioo org (same secret the drift check uses)
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN || secrets.DASHBOARD_PAT }}
          # The guard said "exit 1 + alert" and had no mail code, and this workflow had no alert
          # step and no heartbeat, so its findings could only ever be a red run nobody watches
          # (2026-09-01 audit). Same secrets monitor.yml sends its alert with.
          ALERT_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          ALERT_SMTP_PORT: '465'
          ALERT_SMTP_USER: ${{ secrets.SMTP_USER }}
          ALERT_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: rogmueller1976@gmail.com
          # DB-backed fleet (getFleet). Optional: absent -> getFleet falls back to the hardcoded list.
          BACKOFFICE_SUPABASE_URL: ${{ secrets.BACKOFFICE_SUPABASE_URL }}
          BACKOFFICE_SERVICE_ROLE_KEY: ${{ secrets.BACKOFFICE_SERVICE_ROLE_KEY }}
