name: RLS Grant Drift Guard

# Continuously catches the billing-bypass class found in SignalScore + ChannelMover:
# anon/authenticated holding UPDATE on an entitlement column (tier/credits/subscription_*/
# quota/is_admin/role/stripe_*), or an anon/auth-executable SECURITY DEFINER RPC that mutates
# billing (bypasses RLS). Read-only catalog SELECTs via the Supabase Management API. A red run
# here IS the alert; an email is also sent if ALERT_SMTP_* secrets are set.

on:
  schedule:
    - cron: '20 6 * * 1' # Mondays 06:20 UTC (just after the auth-email guard)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Audit every enforced project's RLS grants (billing-bypass class)
        run: node scripts/check-rls-grants.mjs
        env:
          SUPABASE_TOKEN_MUELLER: ${{ secrets.SUPABASE_TOKEN_MUELLER }}
          SUPABASE_TOKEN_REPLYFLOW: ${{ secrets.REPLYFLOW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN_ARIVIOO: ${{ secrets.SUPABASE_TOKEN_ARIVIOO }}
          SUPABASE_TOKEN_CHANNELMOVER: ${{ secrets.SUPABASE_TOKEN_CHANNELMOVER }}
          SUPABASE_TOKEN_API: ${{ secrets.SUPABASE_TOKEN_API }}
          SUPABASE_TOKEN_LAUNCHREADY: ${{ secrets.SUPABASE_TOKEN_LAUNCHREADY }}
          SUPABASE_TOKEN_DISTRIBUTIONOS: ${{ secrets.SUPABASE_TOKEN_DISTRIBUTIONOS }}
          SUPABASE_TOKEN_SCOUTCOPILOT: ${{ secrets.SUPABASE_TOKEN_SCOUTCOPILOT }}
          SUPABASE_TOKEN_BACKOFFICE: ${{ secrets.BACKOFFICE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN_BOATBUDDY: ${{ secrets.SUPABASE_TOKEN_BOATBUDDY }}
          # 2026-09-01: these referenced secrets.ALERT_SMTP_* and secrets.ALERT_TO, and NONE of
          # those exist in this repo - `gh secret list` has SMTP_HOST/SMTP_USER/SMTP_PASS only.
          # So `if (violations.length && process.env.ALERT_SMTP_HOST)` was always false and this
          # guard's email has never been sent. It found real grant drift on 2026-08-31 and told
          # nobody. Wired to the secrets that exist, same ones monitor.yml sends its alert with.
          ALERT_SMTP_HOST: ${{ secrets.SMTP_HOST }}
          ALERT_SMTP_PORT: '465'
          ALERT_SMTP_USER: ${{ secrets.SMTP_USER }}
          ALERT_SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: rogmueller1976@gmail.com
