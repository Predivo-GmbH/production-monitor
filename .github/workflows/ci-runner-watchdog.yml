name: CI Runner Watchdog

# Watches the self-hosted runners that our CI now runs on, and AUTOMATICALLY falls the whole
# fleet back to GitHub-hosted runners when that machine is unavailable.
#
# Our jobs run on a self-hosted runner in WSL2 on the office PC, because GitHub Actions is rented
# compute at $0.006/minute and a machine we already own costs nothing. The risk is that the PC is
# off, so `runs-on` in every migrated workflow reads a repository VARIABLE
# (`${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}`) and this job moves that variable. Fleet keeps
# shipping either way; the only consequence of the PC being off is that we pay GitHub for a while.
#
# This lives here because production-monitor is PUBLIC, and GitHub does not bill Actions minutes
# on public repositories - so the watchdog over the cost saver is itself free. For the same
# reason this repository must NEVER be given a self-hosted runner: a fork pull request on a
# public repo can run arbitrary code on its runner.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes; a stuck fleet should not wait an hour
  workflow_dispatch: {}

concurrency:
  group: ci-runner-watchdog
  # A watchdog only ever needs the newest run. With cancel-in-progress:false a */10 cron is a
  # backlog generator: once anything wedges, ticks pile up behind it in status=queued (this
  # stranded three runs for 16.5h and made the watchdog page about itself). Cancel the stale run.
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest   # deliberately GitHub-hosted: it must work when our runners do not
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # nodemailer for the alert step; the checker itself is dependency-free
      - run: npm ci

      - name: Check runners and move RUNNER_LABEL if needed
        run: node scripts/check-ci-runners.mjs
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}

      # A red run in the GitHub UI is NOT an alert - nobody is watching the GitHub UI. Without
      # this the fleet could sit on paid runners for days and the first sign would be the bill.
      - name: Email when the fleet falls back to paid runners
        if: failure()
        run: node scripts/send-ci-runner-alert.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: rogmueller1976@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Dead-man's switch. If this workflow itself stops running - disabled after 60 days of repo
      # inactivity, deleted, renamed, or the Actions spend cap stopping every workflow in the
      # account - healthchecks.io notices the missing ping and emails from ITS infrastructure,
      # which is independent of ours. Silence is the failure mode a red run can never report.
      # The URL is a secret, not inline: this repository is PUBLIC, and a published ping URL lets
      # anyone keep the check green while the job is actually dead.
      #
      # IT ANSWERS "DID THIS RUN INSPECT THE FLEET?", NOT "WAS THE JOB GREEN?" (2026-09-03). This
      # step used to branch on `job.status`, and check-ci-runners.mjs exits 1 on ANY finding - a
      # single-machine coverage warning about another repository is enough. So a watchdog that was
      # working and reporting pinged /fail, healthchecks marked it DOWN, and the fleet filed
      # "Scheduled job stopped running: ci-runner-watchdog" against a check that had pinged six
      # minutes earlier and 780 times in total. The more useful this watchdog was, the deader it
      # looked. The finding still travels - the step above mails it and the run is still red; only
      # the dead-man, whose entire job is to notice SILENCE, stops calling noise silence.
      # A run that could NOT certify the fleet still pings /fail: see scripts/lib/watchdog-heartbeat.mjs.
      - name: Heartbeat
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_CI_WATCHDOG }}
          GITHUB_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-watchdog-heartbeat.mjs
